<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>HSLinkDrag – Werbekachel</title>
  <style>
    /* Kleine Werbekachel 440 × 280. Aufruf: tile.html?lang=de|en */
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #e8f0fe 0%, #fef7e0 55%, #fce8e6 100%);
      font-family: system-ui, "Noto Sans", sans-serif;
      color: #1f2328;
    }
    img { width: 120px; height: 120px; }
    h1 { margin: 4px 0 0; font-size: 38px; font-weight: 800; letter-spacing: -.5px; }
    p { margin: 0; font-size: 17px; color: #4a5260; }
  </style>
</head>
<body>
  <img src="../../icons/logo-original.png" alt="">
  <h1>HSLinkDrag</h1>
  <p id="tagline"></p>
  <script>
    const en = new URLSearchParams(location.search).get('lang') === 'en';
    document.documentElement.lang = en ? 'en' : 'de';
    document.getElementById('tagline').textContent = en
      ? 'Drag links, images & text into new tabs'
      : 'Links, Bilder & Text per Drag in neuen Tabs';
  </script>
</body>
</html>
