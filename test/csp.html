<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Strenge CSP: keine Inline-Styles, keine Scripte. Der Hinweis der Erweiterung muss trotzdem formatiert erscheinen. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'none'; script-src 'none'">
  <title>HSLinkDrag – Testseite mit CSP</title>
</head>
<body>
  <h1>HSLinkDrag – Seite mit strenger Content-Security-Policy</h1>
  <p><a href="https://example.com/csp">Diesen Link ziehen</a> → der Hinweis am Mauszeiger erscheint als dunkler Kasten,
     der Link öffnet in einem neuen Tab.</p>
  <p><a href="testseite.html">Zurück zur Testseite</a></p>
</body>
</html>
